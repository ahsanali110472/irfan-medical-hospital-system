<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:;" />
    <title>Loading…</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; background: transparent; font-family: Roboto, Arial, sans-serif; }
      .card { background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); padding: 24px 32px; text-align: center; }
      .logo { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg,#2563EB,#6366F1); margin: 0 auto 12px; }
      .title { font-weight: 700; color: #1f2937; letter-spacing: 0.5px; }
      .subtitle { color: #6b7280; font-size: 13px; margin-top: 6px; }
      .bar { width: 240px; height: 6px; background: #e5e7eb; border-radius: 6px; overflow: hidden; margin: 16px auto 0; }
      .bar > div { width: 40%; height: 100%; background: linear-gradient(90deg,#2563EB,#6366F1); border-radius: 6px; animation: slide 1.4s infinite; }
      @keyframes slide { 0% { transform: translateX(-40%);} 50% { transform: translateX(100%);} 100% { transform: translateX(-40%);} }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"></div>
      <div class="title">Irfan Medical Center</div>
      <div class="subtitle">Starting application…</div>
      <div class="bar"><div></div></div>
    </div>
  </body>
